# SPDX-License-Identifier: AGPL-3.0-only
# A release, built from a tag: the prep GUI as one download per platform
# (the same Python as sleekmenu-prep.pyz, frozen with its interpreter and
# Pillow by PyInstaller, for people with no Python and no terminal) and the
# archive itself, gathered into a draft release with its notes from
# CHANGELOG.md. The ROM needs the libdragon toolchain and is added to the
# draft by hand before it is published.
#
# Run it from the Actions tab (Run workflow) to try the builds without
# tagging: the downloads are then the run's artifacts, and no release is
# made. The binaries are not code-signed: macOS and Windows warn the first
# time, and the README says what to click.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The window's tests prepare cards with no collection; they stay offline
  # on their own, and this covers what a future test forgets.
  SLEEKMENU_NO_DOWNLOAD: '1'

jobs:
  version:
    # A tag names the release the source says it is, or nothing is built:
    # a v1.2.0 tag on a tree that still says 1.1.0 would ship a window and
    # a start screen that both name the wrong release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches tools/version.py and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'from tools import version; print(version.VERSION)')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but the source says $version (tools/version.py, src/version.h)"
            exit 1
          fi
          grep -q "^## $version\b" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

  prep-gui:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac-arm64
          - os: macos-15-intel
            name: mac-intel
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and PyInstaller
        run: pip install -r requirements-dev.txt "pyinstaller>=6,<7"

      - name: Check the window's logic
        # The parts that need no screen, on every platform; the window
        # itself on Linux, under a virtual display.
        run: python -m unittest tests.test_sleekmenu_gui -v

      - name: Check the window itself
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m unittest tests.test_sleekmenu_gui -v

      - name: Freeze
        # One file on Windows and Linux. On macOS an app bundle is already
        # one thing to download, and a one-file bundle would unpack itself
        # on every launch, which PyInstaller is retiring. The data files are
        # named relative to the checkout, where the spec is written: on
        # Windows, bash spells $PWD /d/a/..., which PyInstaller cannot find.
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) shape="--onedir" ;;
            *)     shape="--onefile" ;;
          esac
          python -m PyInstaller --noconfirm $shape --windowed \
            --name "SleekMenu-Prep" --paths . \
            --add-data "data/coverdb.csv:data" \
            --add-data "data/genres.csv:data" \
            --add-data "data/LICENSE:data" \
            tools/sleekmenu_gui.py

      - name: Prove the build starts and prepares a card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.rom_fixtures import write_rom
          from tests.test_sleekmenu_prep import write_collection
          write_rom(Path("smoke/CARD/ROMS/Wave Race 64 (USA).z64"), 0x11, 0x22, game_code="WR")
          write_collection(Path("smoke/CARD/release-metadata.zip"), "NWRE", zipped=True)
          PY
          case "${{ runner.os }}" in
            macOS)   app="dist/SleekMenu-Prep.app/Contents/MacOS/SleekMenu-Prep" ;;
            Windows) app="dist/SleekMenu-Prep.exe" ;;
            *)       app="dist/SleekMenu-Prep" ;;
          esac
          card="$PWD/smoke/CARD"
          run=""
          case "${{ runner.os }}" in
            Linux)   sudo apt-get install -y xvfb; run="xvfb-run -a" ;;
            Windows) card="$(pwd -W)/smoke/CARD" ;;
          esac
          $run "$app" --smoke --card "$card"
          test -f smoke/CARD/sleekmenu/catalog.ebc
          test -f smoke/CARD/sleekmenu/covers.pak

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --keepParent dist/SleekMenu-Prep.app "out/SleekMenu-Prep-${{ matrix.name }}.zip" ;;
            Windows)
              cp dist/SleekMenu-Prep.exe "out/SleekMenu-Prep-${{ matrix.name }}.exe" ;;
            *)
              cp dist/SleekMenu-Prep "out/SleekMenu-Prep-${{ matrix.name }}" ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SleekMenu-Prep-${{ matrix.name }}
          path: out/*

  prep-archive:
    # The same tool for anyone with Python, run from the card.
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make prep
      - uses: actions/upload-artifact@v4
        with:
          name: sleekmenu-prep
          path: build/release/sleekmenu-prep.pyz

  release:
    # One job makes the release, after every build has passed, so a
    # platform that failed never leaves a release with three downloads out
    # of four. A draft: the ROM goes on by hand, and nothing is public
    # until Publish is pressed.
    needs: [prep-gui, prep-archive]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: The notes, from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from tools import version
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## {re.escape(version.VERSION)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          Path("notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
          cat notes.md
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: SleekMenu 64 ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true

      - name: What is left to do
        run: |
          echo "A draft release for $GITHUB_REF_NAME is on the Releases page." >> "$GITHUB_STEP_SUMMARY"
          echo "Add SleekMenu64.z64 (make slim) to it, read the notes, then Publish." >> "$GITHUB_STEP_SUMMARY"
